name: 아침 뱅킹 브리핑

on:
  schedule:
    # UTC 기준. 22:00 UTC = 다음날 07:00 KST (아침 7시).
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install -r requirements.txt

      - name: run brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python main.py

      - name: commit results
        run: |
          git config user.name "banking-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html history.json
          git commit -m "brief: $(date -u +%Y-%m-%d)" || echo "no change"
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push)
